# ============================================================================
#  Keep-alive de la base de datos (GitHub Actions)
#  Llama a /api/keep-alive para que la base de datos de Supabase (plan
#  gratuito) no se pause por inactividad.
#
#  Nota: GitHub Actions ESTRANGULA los crons muy frecuentes en repos de bajo
#  uso (un "*/10" real corría ~cada 2 h y cancelaba ejecuciones encoladas,
#  generando correos de fallo). Por eso se usa cada 30 min, fuera de la hora
#  en punto (alta carga), y el job nunca falla por errores transitorios.
#  Para mantener la base "caliente" (sin arranque en frío) de forma fiable,
#  un pinger externo (UptimeRobot cada 5 min) es más efectivo.
# ============================================================================

name: keep-alive

on:
  schedule:
    # Cada 30 min, en :13 y :43 (evita la hora en punto, de alta carga).
    - cron: "13,43 * * * *"
  workflow_dispatch:

# Evita que ejecuciones solapadas se cancelen entre sí.
concurrency:
  group: keep-alive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Despertar la base de datos
        run: |
          echo "Pingeando keep-alive..."
          code=$(curl -s -o /tmp/body.txt -w "%{http_code}" \
            --max-time 120 \
            https://congregacion-ocoa.vercel.app/api/keep-alive || echo "000")
          echo "HTTP $code"
          cat /tmp/body.txt || true
          # Solo un aviso (no falla el job): así no llegan correos por
          # respuestas lentas o de arranque en frío. La consulta ya "despertó"
          # la base aunque la respuesta tarde o no sea 2xx.
          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
            echo "::warning::keep-alive respondió $code (no crítico)"
          fi
